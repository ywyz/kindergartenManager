name: Cloud candidate image
on:
  push:
    branches:
      - 'codex/wp-cloud-delivery-*'
      - 'codex/wp-cloud-rollback-*'
    paths:
      - 'app/**'
      - 'alembic/**'
      - 'templates/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/render/**'
      - 'scripts/render_environment.py'
      - '.github/workflows/candidate-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: candidate-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image repository
        id: repo
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "name=ghcr.io/${owner,,}/kindergartenmanager" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.repo.outputs.name }}:candidate-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          cache-from: type=gha,scope=weekly-runtime
          cache-to: type=gha,mode=max,scope=weekly-runtime
      - name: Verify and record immutable candidate
        env:
          IMAGE: ${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ steps.repo.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect --raw "$IMAGE" > image-index.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          index = json.loads(Path('image-index.json').read_text())
          manifests = index.get('manifests', [])
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in manifests}
          assert index['mediaType'] == 'application/vnd.oci.image.index.v1+json'
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')} and len(manifests) == 2
          Path('candidate-image.json').write_text(json.dumps({
              'schema_version': 1, 'role': 'cloud-candidate-not-release',
              'source_sha': os.environ['GITHUB_SHA'], 'repository': os.environ['REPOSITORY'],
              'digest': os.environ['DIGEST'], 'ref': os.environ['IMAGE'],
              'media_type': index['mediaType'], 'platforms': ['linux/amd64', 'linux/arm64'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image-${{ github.sha }}
          path: |
            candidate-image.json
            image-index.json
