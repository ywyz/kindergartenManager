name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite+aiosqlite:///./quality-ci.sqlite3

jobs:
  quality:
    name: Python 3.14 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip

      - name: Install public rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libreoffice-writer poppler-utils fontconfig
          dpkg-query -W libreoffice-writer poppler-utils fontconfig
          libreoffice --version
          pdftocairo -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.16.6 pip-audit==2.10.1
          python -m pip check

      - name: Audit dependencies
        run: >-
          python -m pip_audit
          --requirement requirements.txt
          --strict
          --progress-spinner off

      - name: Ruff changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            lint_base="origin/$BASE_REF"
          elif [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}"; then
            lint_base="$BEFORE_SHA"
          else
            lint_base="origin/$DEFAULT_BRANCH"
          fi

          mapfile -d '' python_files < <(
            git diff --name-only -z --diff-filter=ACMR "$lint_base"...HEAD -- '*.py'
          )
          python scripts/check_changed_python.py "${python_files[@]}"

      - name: Migrate fresh SQLite database
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Test
        run: |
          # SimSun requires separately authorized provisioning; never fetch a
          # Windows font from an arbitrary archive or substitute another family.
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          family = subprocess.check_output(["fc-match", "-f", "%{family}", "SimSun"], text=True)
          if "SimSun" not in family.split(","):
              raise SystemExit("SimSun unavailable: licensed runner font provisioning is required; rendering tests cannot be skipped")
          font = pathlib.Path(subprocess.check_output(["fc-match", "-f", "%{file}", "SimSun"], text=True))
          print("SimSun SHA256:", hashlib.sha256(font.read_bytes()).hexdigest())
          PY
          python -m pytest tests/ -q

      - name: Agent Foundation
        run: python -m pytest specs/agent-foundation/tests -q
