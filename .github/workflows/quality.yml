name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: sqlite+aiosqlite:///./quality-ci.sqlite3

jobs:
  quality:
    name: Python 3.14 quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff==0.16.6 pip-audit==2.10.1
          python -m pip check

      - name: Audit dependencies
        run: >-
          python -m pip_audit
          --requirement requirements.txt
          --strict
          --progress-spinner off

      - name: Ruff changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            lint_base="origin/$BASE_REF"
          elif [[ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}"; then
            lint_base="$BEFORE_SHA"
          else
            lint_base="origin/$DEFAULT_BRANCH"
          fi

          mapfile -d '' python_files < <(
            git diff --name-only -z --diff-filter=ACMR "$lint_base"...HEAD -- '*.py'
          )
          python scripts/check_changed_python.py "${python_files[@]}"

      - name: Migrate fresh SQLite database
        run: |
          python -m alembic upgrade head
          python -m alembic current

      - name: Ordinary tests (no renderer provisioning)
        run: python -m pytest tests/ -m 'not real_render' -q

      - name: Agent Foundation
        run: python -m pytest specs/agent-foundation/tests -q

  render-tests:
    name: Real LibreOffice rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: render-test
          load: true
          tags: kindergarten-render-test:ci
          cache-from: type=gha,scope=weekly-runtime
          cache-to: type=gha,mode=max,scope=weekly-render-tests
      - name: Verify tools, font and actual rendering
        run: |
          docker run --rm kindergarten-render-test:ci python -m scripts.render_environment
          docker run --rm kindergarten-render-test:ci python -m pytest tests/ -m real_render -q
