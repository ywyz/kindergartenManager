name: Release Build

# 推送 v* 格式的 tag 时触发（例如 v3.0.0-beta.1、v1.2.3）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # 创建 GitHub Release 并上传附件
  packages: write       # 推送到 GitHub Container Registry (ghcr.io)

# Node.js 24 opt-in（Node.js 20 将于 2026-06-16 强制替换）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows 安装包 + 便携包 ───────────────────────────────────────────────
  build-windows:
    name: Build Windows (Installer + ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller kindergartenManager.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Extract version (strip leading v)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Windows installer (Inno Setup)
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ^
            packaging\windows\installer.iss ^
            /DMyAppVersion=${{ steps.ver.outputs.version }}

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\KindergartenManager\*" `
            -DestinationPath "dist\KindergartenManager-${{ steps.ver.outputs.version }}-windows-portable.zip"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/KindergartenManager-Setup-${{ steps.ver.outputs.version }}.exe
          retention-days: 7

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/KindergartenManager-${{ steps.ver.outputs.version }}-windows-portable.zip
          retention-days: 7

  # ── Linux .deb + 便携包 ───────────────────────────────────────────────────
  build-linux:
    name: Build Linux (deb + tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc dpkg-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller kindergartenManager.spec

      - name: Extract version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: bash packaging/debian/build-deb.sh ${{ steps.ver.outputs.version }}

      - name: Create portable tar.gz
        run: |
          tar -czf "dist/KindergartenManager-${{ steps.ver.outputs.version }}-linux-portable.tar.gz" \
            -C dist KindergartenManager

      - name: Upload Linux deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/kindergarten-manager_${{ steps.ver.outputs.version }}_amd64.deb
          retention-days: 7

      - name: Upload Linux portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: dist/KindergartenManager-${{ steps.ver.outputs.version }}-linux-portable.tar.gz
          retention-days: 7

  # ── Docker 镜像（服务器版） ────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image_metadata.outputs.digest }}
      image_ref: ${{ steps.image_metadata.outputs.ref }}
      image_repository: ${{ steps.image_metadata.outputs.repository }}
      source_sha: ${{ github.sha }}
      image_media_type: ${{ steps.image_media.outputs.media_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image repository
        id: image_repository
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "repository=ghcr.io/${owner,,}/kindergartenmanager" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_repository.outputs.repository }}
          # latest 仅随正式版（无 - 后缀 tag）更新，beta/rc 不覆盖 latest
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture immutable index metadata
        id: image_metadata
        shell: bash
        run: |
          repository="${{ steps.image_repository.outputs.repository }}"
          digest="${{ steps.docker_build.outputs.digest }}"
          immutable_ref="${repository}@${digest}"

          if [[ "${digest}" != sha256:* ]]; then
            echo "Invalid image digest from build-push-action: ${digest}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${immutable_ref}" >> "$GITHUB_OUTPUT"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate metadata indicates OCI image index
        id: image_media
        shell: bash
        run: |
          media_type="$(
            docker buildx imagetools inspect --raw \
              "${{ steps.image_metadata.outputs.ref }}" \
              | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          media_type = payload.get("mediaType", "")
          expected = {("linux", "amd64"), ("linux", "arm64")}
          actual = {
              (platform.get("os"), platform.get("architecture"))
              for manifest in payload.get("manifests", [])
              if isinstance(manifest, dict)
              and isinstance((platform := manifest.get("platform")), dict)
          }
          if media_type != "application/vnd.oci.image.index.v1+json":
              raise SystemExit(f"Unsupported media type: {media_type}")
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if actual != expected or len(payload.get("manifests", [])) != len(expected):
              raise SystemExit(
                  "OCI image index must contain exactly required platforms; "
                  f"missing required platforms: {missing}; unexpected platforms: {unexpected}"
              )
          print(media_type)
          '
          )"

          echo "media_type=$media_type" >> "$GITHUB_OUTPUT"

  # ── 创建 GitHub Release ──────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-docker]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 显式按名称下载，跳过 Docker 构建缓存（*.dockerbuild）等非发布 artifact
      - name: Download windows-installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows-installer/

      - name: Download windows-portable
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: artifacts/windows-portable/

      - name: Download linux-deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux-deb/

      - name: Download linux-portable
        uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: artifacts/linux-portable/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Materialize OCI image descriptor
        run: |
          mkdir -p artifacts/docker-image
          cat > artifacts/docker-image/docker-image.json <<'JSON'
          {
            "schema_version": 2,
            "release_tag": "${{ github.ref_name }}",
            "source_sha": "${{ github.sha }}",
            "repository": "${{ needs.build-docker.outputs.image_repository }}",
            "digest": "${{ needs.build-docker.outputs.image_digest }}",
            "ref": "${{ needs.build-docker.outputs.image_ref }}",
            "media_type": "${{ needs.build-docker.outputs.image_media_type }}",
            "platforms": ["linux/amd64", "linux/arm64"]
          }
          JSON

      - name: Upload docker-image descriptor
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: artifacts/docker-image/docker-image.json

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # tag 中含 "-"（如 beta、rc）则标记为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## 幼儿园教学管理系统 ${{ github.ref_name }}

            ### 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `KindergartenManager-Setup-${{ steps.ver.outputs.version }}.exe` | 安装向导（推荐） |
            | Windows | `KindergartenManager-${{ steps.ver.outputs.version }}-windows-portable.zip` | 便携包（解压即用） |
            | Ubuntu/Debian | `kindergarten-manager_${{ steps.ver.outputs.version }}_amd64.deb` | .deb 安装包（含 systemd） |
            | Ubuntu/Linux | `KindergartenManager-${{ steps.ver.outputs.version }}-linux-portable.tar.gz` | 便携包（解压即用） |
            | Docker | `${{ needs.build-docker.outputs.image_repository }}:${{ steps.ver.outputs.version }}` | 服务器部署 |
            | Docker（不可变） | `${{ needs.build-docker.outputs.image_ref }}` | 服务器部署 |

            ### Docker 不可变引用说明

            | 字段 | 值 |
            |---|---|
            | Release tag | `${{ github.ref_name }}` |
            | Source SHA | `${{ github.sha }}` |
            | Repository | `${{ needs.build-docker.outputs.image_repository }}` |
            | OCI index digest | `${{ needs.build-docker.outputs.image_digest }}` |
            | 不可变引用 | `${{ needs.build-docker.outputs.image_ref }}` |
            | Media type | `${{ needs.build-docker.outputs.image_media_type }}` |
            | Platforms | `linux/amd64`, `linux/arm64` |

            `docker-image.json` 已随 release 资产发布，需与 Release body 和 tag/SHA 逐项一致；若不一致则视为发布不收敛。

            ---

            ### 🪟 Windows 安装版（推荐）

            1. 下载 `KindergartenManager-Setup-${{ steps.ver.outputs.version }}.exe`
            2. 双击运行安装向导，按提示完成安装
            3. 安装结束时不要启动应用；若已自动启动请先关闭，再在 PowerShell 中显式创建管理员（密码交互输入，不回显）：

               ```powershell
               cd "$env:ProgramFiles\KindergartenManager"
               .\KindergartenManager.exe --init
               ```

            4. 从开始菜单或桌面快捷方式启动
            5. 访问 http://localhost:8080/login 登录

            > ⚠️ **Windows 安全提示**：首次运行可能触发 Windows Defender 警告，点击"更多信息" → "仍要运行"即可。

            **零配置模式（内嵌 SQLite）**：直接安装即可使用，无需额外配置数据库。

            **MySQL 模式**：请在 `%LOCALAPPDATA%\KindergartenManager\.env` 写入 `DATABASE_URL=mysql+aiomysql://...`（或等效用户数据目录变量），重启程序。

            ---

            ### 🐧 Ubuntu/Debian 安装版（含 systemd 自动启动）

            ```bash
            # 下载 .deb 并安装
            sudo dpkg -i kindergarten-manager_${{ steps.ver.outputs.version }}_amd64.deb

            # 首次创建管理员：停止应用，复用 systemd 的受保护配置交互初始化
            sudo systemctl stop kindergarten-manager
            sudo systemd-run --wait --pty --collect \
              --property=User=kindergarten-manager \
              --property=EnvironmentFile=/etc/kindergarten-manager/env \
              --property=WorkingDirectory=/var/lib/kindergarten-manager \
              /opt/kindergarten-manager/KindergartenManager --init
            sudo systemctl start kindergarten-manager

            # 登录：http://localhost:8080/login
            ```

            配置文件：`/etc/kindergarten-manager/env`（安装时自动生成随机密钥）

            ```bash
            # 查看服务状态
            systemctl status kindergarten-manager

            # 查看日志
            journalctl -u kindergarten-manager -f
            ```

            ---

            ### 🐳 Docker 服务器版

            ```bash
            # 部署示例（推荐）：python -m scripts.deploy --service app \
            #   --backup-evidence /secure/path/backup-evidence.json \
            #   --protected-image <当前不可变镜像ref> \
            #   --health-url https://manager.example.com/api/v1/health \
            #   --readiness-url https://manager.example.com/api/v1/readiness \
            #   deploy ${{ needs.build-docker.outputs.image_ref }}
            # 使用仓库中的 docker-compose.yml（含 MySQL 8）
            cp .env.example .env
            # 填写已解析到本机的 CADDY_DOMAIN，并用密码管理器填写
            # MYSQL_ROOT_PASSWORD、MYSQL_PASSWORD，
            # 并固定 ENCRYPTION_KEY、JWT_SECRET；MySQL 密码使用十六进制随机值。
            docker compose up -d

            # 首次创建管理员（密码交互输入，不回显）。
            # 该远程 override 只对本次 exec 生效，不得进入常驻 app 容器环境。
            docker compose exec -e BOOTSTRAP_ADMIN_ALLOW_REMOTE=true app python -m app.jobs.bootstrap_admin --init

            # 或直接拉取本 release 的不可变 OCI index（使用外部 MySQL）
            docker pull ${{ needs.build-docker.outputs.image_ref }}
            ```

            **最简 Docker 启动（SQLite，演示用）**：
            ```bash
            docker run -d --name kindergarten-manager \
              -p 127.0.0.1:8080:8080 \
              -e ENCRYPTION_KEY="$(head -c 32 /dev/urandom | base64)" \
              -e JWT_SECRET="$(head -c 64 /dev/urandom | base64)" \
              -v kg-data:/data \
              ${{ needs.build-docker.outputs.image_ref }}

            docker exec -it kindergarten-manager \
              python -m app.jobs.bootstrap_admin --init
            ```

            > 说明：该健康检查示例仅用于存活验证；数据库 readiness 的完整检查目前由
            > [Issue #54](https://github.com/ywyz/kindergartenManager/issues/54) 负责。

            ---

            ### ⚙️ 环境变量说明（服务器/MySQL 模式必填）

            | 变量 | 必填 | 说明 |
            |------|------|------|
            | `CADDY_DOMAIN` | Compose 必填 | 已解析到部署主机的公网域名；Caddy 自动提供 HTTPS |
            | `DATABASE_URL` | 否 | 留空使用内嵌 SQLite；MySQL 示例：`mysql+aiomysql://user:pass@host:3306/db` |
            | `ENCRYPTION_KEY` | 推荐 | AI Key 加密密钥，留空自动生成并持久化 |
            | `JWT_SECRET` | 推荐 | JWT 签名密钥，留空自动生成并持久化 |
            | `HOLIDAY_API_URL` | 否 | 节假日 API，默认 `https://timor.tech/api/holiday/info/` |

            > ⚠️ **重要**：生产/服务器环境请在配置文件中显式设置 `ENCRYPTION_KEY` 和 `JWT_SECRET`，
            > 避免每次重启生成新密钥导致已加密数据无法解密；部署与升级时保留 `app_data`、
            > `db_data` 与 `exports` 卷。

            详细使用说明请查阅 [用户手册](docs/USER_MANUAL.md)。

  verify-release:
    name: Verify release metadata convergence
    needs: [build-docker, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download docker-image descriptor
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: artifacts/docker-image

      - name: Verify release body and release artifacts match immutable refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ needs.build-docker.outputs.image_repository }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.build-docker.outputs.image_digest }}
          EXPECTED_IMAGE_REF: ${{ needs.build-docker.outputs.image_ref }}
          EXPECTED_MEDIA_TYPE: ${{ needs.build-docker.outputs.image_media_type }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          python scripts/release_convergence.py \
            --repo "$GITHUB_REPO" \
            --release-id "$RELEASE_ID" \
            --descriptor artifacts/docker-image/docker-image.json \
            --tag "$RELEASE_TAG" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --digest "$EXPECTED_IMAGE_DIGEST" \
            --ref "$EXPECTED_IMAGE_REF" \
            --media-type "$EXPECTED_MEDIA_TYPE" \
            --platform linux/amd64 \
            --platform linux/arm64
