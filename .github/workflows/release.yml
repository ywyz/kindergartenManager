name: Release Build

# 推送 v* 格式的 tag 时触发（例如 v3.0.0-beta.1、v1.2.3）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write       # 创建 GitHub Release 并上传附件
  packages: write       # 推送到 GitHub Container Registry (ghcr.io)

# Node.js 24 opt-in（Node.js 20 将于 2026-06-16 强制替换）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Docker 镜像（服务器版） ────────────────────────────────────────────────
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image_metadata.outputs.digest }}
      image_ref: ${{ steps.image_metadata.outputs.ref }}
      image_repository: ${{ steps.image_metadata.outputs.repository }}
      source_sha: ${{ github.sha }}
      image_media_type: ${{ steps.image_media.outputs.media_type }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image repository
        id: image_repository
        shell: bash
        run: |
          owner="${{ github.repository_owner }}"
          echo "repository=ghcr.io/${owner,,}/kindergartenmanager" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_repository.outputs.repository }}
          # latest 仅随正式版（无 - 后缀 tag）更新，beta/rc 不覆盖 latest
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Capture immutable index metadata
        id: image_metadata
        shell: bash
        run: |
          repository="${{ steps.image_repository.outputs.repository }}"
          digest="${{ steps.docker_build.outputs.digest }}"
          immutable_ref="${repository}@${digest}"

          if [[ "${digest}" != sha256:* ]]; then
            echo "Invalid image digest from build-push-action: ${digest}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "ref=${immutable_ref}" >> "$GITHUB_OUTPUT"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate metadata indicates OCI image index
        id: image_media
        shell: bash
        run: |
          media_type="$(
            docker buildx imagetools inspect --raw \
              "${{ steps.image_metadata.outputs.ref }}" \
              | python -c '
          import json, sys
          payload = json.load(sys.stdin)
          media_type = payload.get("mediaType", "")
          expected = {("linux", "amd64"), ("linux", "arm64")}
          actual = {
              (platform.get("os"), platform.get("architecture"))
              for manifest in payload.get("manifests", [])
              if isinstance(manifest, dict)
              and isinstance((platform := manifest.get("platform")), dict)
          }
          if media_type != "application/vnd.oci.image.index.v1+json":
              raise SystemExit(f"Unsupported media type: {media_type}")
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if actual != expected or len(payload.get("manifests", [])) != len(expected):
              raise SystemExit(
                  "OCI image index must contain exactly required platforms; "
                  f"missing required platforms: {missing}; unexpected platforms: {unexpected}"
              )
          print(media_type)
          '
          )"

          echo "media_type=$media_type" >> "$GITHUB_OUTPUT"

  # ── 创建 GitHub Release ──────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-docker]
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Materialize OCI image descriptor
        run: |
          mkdir -p artifacts/docker-image
          cat > artifacts/docker-image/docker-image.json <<'JSON'
          {
            "schema_version": 2,
            "release_tag": "${{ github.ref_name }}",
            "source_sha": "${{ github.sha }}",
            "repository": "${{ needs.build-docker.outputs.image_repository }}",
            "digest": "${{ needs.build-docker.outputs.image_digest }}",
            "ref": "${{ needs.build-docker.outputs.image_ref }}",
            "media_type": "${{ needs.build-docker.outputs.image_media_type }}",
            "platforms": ["linux/amd64", "linux/arm64"]
          }
          JSON

      - name: Upload docker-image descriptor
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: artifacts/docker-image/docker-image.json

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # tag 中含 "-"（如 beta、rc）则标记为 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            ## 幼儿园教学管理系统 ${{ github.ref_name }}

            ### 下载说明

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Docker | `${{ needs.build-docker.outputs.image_repository }}:${{ steps.ver.outputs.version }}` | 服务器部署 |
            | Docker（不可变） | `${{ needs.build-docker.outputs.image_ref }}` | 服务器部署 |

            ### Docker 不可变引用说明

            | 字段 | 值 |
            |---|---|
            | Release tag | `${{ github.ref_name }}` |
            | Source SHA | `${{ github.sha }}` |
            | Repository | `${{ needs.build-docker.outputs.image_repository }}` |
            | OCI index digest | `${{ needs.build-docker.outputs.image_digest }}` |
            | 不可变引用 | `${{ needs.build-docker.outputs.image_ref }}` |
            | Media type | `${{ needs.build-docker.outputs.image_media_type }}` |
            | Platforms | `linux/amd64`, `linux/arm64` |

            ---

            `docker-image.json` 已随 release 资产发布，需与 Release body 和 tag/SHA 逐项一致；若不一致则视为发布不收敛。

            ### 🐳 Docker 服务器版

            ```bash
            # 部署示例（推荐）：python -m scripts.deploy --service app \
            #   --backup-evidence /secure/path/backup-evidence.json \
            #   --protected-image <当前不可变镜像ref> \
            #   --acceptance-runner /secure/path/r5-acceptance-runner \
            #   --health-url https://manager.example.com/api/v1/health \
            #   --readiness-url https://manager.example.com/api/v1/readiness \
            #   deploy ${{ needs.build-docker.outputs.image_ref }}
            # 使用仓库中的 docker-compose.yml（含 MySQL 8）
            cp .env.example .env
            # 填写已解析到本机的 CADDY_DOMAIN，并用密码管理器填写
            # MYSQL_ROOT_PASSWORD、MYSQL_PASSWORD，
            # 并固定 ENCRYPTION_KEY、JWT_SECRET；MySQL 密码使用十六进制随机值。
            # 首次上线先按部署指南完成备份恢复验证与显式数据库迁移，再通过 deploy helper 启动。

            # 或直接拉取本 release 的不可变 OCI index（使用外部 MySQL）
            docker pull ${{ needs.build-docker.outputs.image_ref }}
            ```

            `/api/v1/health` 只验证存活；`/api/v1/readiness` 独立验证数据库连接和 Alembic revision。
            管理员初始化通过受控 Bootstrap job 完成；上线还需通过受保护登录、关键业务和备份恢复验收。
            首次部署与管理员初始化的前置步骤见 [部署指南](docs/DEPLOYMENT.md) 和 [用户手册](docs/USER_MANUAL.md)。
            系统通过云端 HTTPS 使用；Microsoft Word 和 LibreOffice 仅用于检查下载的 DOCX。

            ---

            ### ⚙️ 环境变量说明（服务器/MySQL 模式必填）

            | 变量 | 必填 | 说明 |
            |------|------|------|
            | `CADDY_DOMAIN` | Compose 必填 | 已解析到部署主机的公网域名；Caddy 自动提供 HTTPS |
            | `DATABASE_URL` | 生产必填 | MySQL 示例：`mysql+aiomysql://user:pass@host:3306/db` |
            | `ENCRYPTION_KEY` | 推荐 | AI Key 加密密钥，留空自动生成并持久化 |
            | `JWT_SECRET` | 推荐 | JWT 签名密钥，留空自动生成并持久化 |
            | `HOLIDAY_API_URL` | 否 | 节假日 API，默认 `https://timor.tech/api/holiday/info/` |

            > ⚠️ **重要**：生产/服务器环境请在配置文件中显式设置 `ENCRYPTION_KEY` 和 `JWT_SECRET`，
            > 避免每次重启生成新密钥导致已加密数据无法解密；部署与升级时保留 `app_data`、
            > `db_data` 与 `exports` 卷。

            详细使用说明请查阅 [用户手册](docs/USER_MANUAL.md)。

  verify-release:
    name: Verify release metadata convergence
    needs: [build-docker, create-release]
    runs-on: ubuntu-latest
    permissions:
      # Draft Releases are visible only to tokens with push-level repository access.
      # The convergence script remains read-only unless --publish is explicit.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'

      - name: Download docker-image descriptor
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: artifacts/docker-image

      - name: Verify release body and release artifacts match immutable refs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          EXPECTED_REPOSITORY: ${{ needs.build-docker.outputs.image_repository }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_IMAGE_DIGEST: ${{ needs.build-docker.outputs.image_digest }}
          EXPECTED_IMAGE_REF: ${{ needs.build-docker.outputs.image_ref }}
          EXPECTED_MEDIA_TYPE: ${{ needs.build-docker.outputs.image_media_type }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy
          python scripts/release_convergence.py \
            --repo "$GITHUB_REPO" \
            --release-id "$RELEASE_ID" \
            --descriptor artifacts/docker-image/docker-image.json \
            --tag "$RELEASE_TAG" \
            --source-sha "$EXPECTED_SOURCE_SHA" \
            --repository "$EXPECTED_REPOSITORY" \
            --digest "$EXPECTED_IMAGE_DIGEST" \
            --ref "$EXPECTED_IMAGE_REF" \
            --media-type "$EXPECTED_MEDIA_TYPE" \
            --platform linux/amd64 \
            --platform linux/arm64
