services:
  # ── 反向代理（Caddy：自动 HTTPS + 反向代理）──────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - kindergarten_net

  # ── 主系统（NiceGUI 前后端一体化）──────────────────────────────────────
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      KINDERGARTEN_DATA_DIR: /data
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER:-kindergarten}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-kindergarten_db}
    env_file:
      - .env
    volumes:
      - app_data:/data
      - exports:/app/exports
    restart: unless-stopped
    networks:
      - kindergarten_net

  # ── 数据库（MySQL，生产模式）──────────────────────────────────────────────
  db:
    image: mysql:8
    command:
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kindergarten_db}
      MYSQL_USER: ${MYSQL_USER:-kindergarten}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}"
          mysqladmin ping -h localhost -u root --silent
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kindergarten_net

networks:
  kindergarten_net:
    driver: bridge

volumes:
  app_data:
  db_data:
  exports:
  caddy_data:
  caddy_config:
