services:
  # ── 反向代理（Caddy：自动 HTTPS + 反向代理）──────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - kindergarten_net

  # ── 主系统（NiceGUI 前后端一体化）──────────────────────────────────────
  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
    env_file:
      - .env
    volumes:
      - exports:/app/exports
    restart: unless-stopped
    networks:
      - kindergarten_net

networks:
  kindergarten_net:
    driver: bridge

volumes:
  exports:
  caddy_data:
  caddy_config: